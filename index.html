
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeBot — En creación</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:#666;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      background:var(--bg);
      color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .wrap{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .box{
      max-width:520px;
      width:100%;
    }
    h1{
      font-size:2.2rem;
      letter-spacing:-.04em;
      margin:0 0 24px 0;
    }
    p{
      margin:0 0 16px 0;
      color:var(--muted);
      line-height:1.6;
      font-size:.95rem;
    }
    .links{
      margin-top:32px;
      font-size:.9rem;
    }
    a{
      color:var(--fg);
      text-decoration:none;
      display:block;
      margin-top:8px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="box">
      <h1>Página en creación</h1>
      <p>
        CodeBot está en desarrollo.
        Esta página va a servir como punto de información, documentación y acceso a la API de CodeBOT.
      </p>
      <p>
        No hay fecha. No hay promesas.
        Cuando esté lista, va a estarlo.
      </p>
      <div class="links">
        <a href="https://2b2t.com.ar/discord" target="_blank">2B2T Argentina — Discord</a>
        <a href="https://2b2tar.miraheze.org" target="_blank">2B2T Argentina — Wiki</a>
        <a href="https://discord.gg/cFsyWvQj9Q" target="_blank">2B2T Argentina — Discord </a>
      </div>
    </div>
  </main>
</body>
</html>
